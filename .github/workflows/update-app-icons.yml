name: Update app icons

on:
  push:
    branches: [master]
    paths:
      - scripts/app-icon-source.ready

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate all platform icons
        run: python scripts/update-app-icons.py

      - name: Commit generated icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/HelloV.Core/Assets/AppIcon.png \
            src/HelloV.Browser/wwwroot/app-icon.png \
            src/HelloV.Desktop/Assets/app-icon.png \
            src/HelloV.Desktop/Assets/app-icon.ico \
            src/HelloV.Desktop/Assets/app-icon.icns \
            src/HelloV.Android/Resources/drawable-nodpi/app_icon_foreground.png \
            src/HelloV.Android/Resources/mipmap-*/app_icon.png \
            src/HelloV.Android/Resources/mipmap-*/app_icon_round.png \
            src/HelloV.iOS/Assets.xcassets/AppIcon.appiconset/*.png

          if git diff --cached --quiet; then
            echo "No icon changes were generated."
            exit 0
          fi

          git commit -m "Replace HelloV application icons"
          git push origin HEAD:master
