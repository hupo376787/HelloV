<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090A0F" />
  <title>HelloV</title>
  <link rel="icon" type="image/png" href="./app-icon.png" />
  <link rel="preload" as="image" href="./app-icon.png" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <!-- getUserMedia is decoded by this off-screen video. Frames are copied into Avalonia so the
       preview and every overlay remain in one composited canvas. -->
  <video id="hellov-camera" autoplay muted playsinline aria-hidden="true"></video>
  <canvas id="hellov-preview" width="2" height="2" aria-hidden="true"></canvas>
  <canvas id="hellov-inference" width="640" height="640" aria-hidden="true"></canvas>

  <div id="out">
    <div class="hellov-splash" role="status" aria-live="polite">
      <img src="./app-icon.png" alt="HelloV" />
      <div class="hellov-splash-title">HelloV</div>
      <div class="hellov-splash-subtitle">正在启动浏览器摄像头与手势识别…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.all.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
